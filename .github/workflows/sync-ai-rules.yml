name: Sync routing rules

on:
  schedule:
    # UTC 00:17 / 06:17 / 12:17 / 18:17; Asia/Shanghai 08:17 / 14:17 / 20:17 / 02:17.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/**
      - scripts/**
      - rules/custom/**
      - examples/**
      - tests/**
      - .github/workflows/sync-ai-rules.yml

permissions:
  contents: read

concurrency:
  group: sync-routing-rules-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify categorized list layout
        run: >-
          python3 -c "from pathlib import Path; flat = [*Path('.').glob('*.list'), *Path('rules/custom').glob('*.list')]; assert not flat, 'Retired flat lists: ' + ', '.join(map(str, flat))"
      - name: Test parser, service boundaries and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Fetch, filter and generate all service lists
        run: python3 scripts/sync_rules.py
      - name: Stamp manual rule metadata
        run: python3 scripts/stamp_custom.py
      - name: Build categorized collections
        run: python3 scripts/build_collections.py
      - name: Validate categorized lists and profile offline
        run: |
          python3 scripts/stamp_custom.py --validate
          python3 scripts/sync_rules.py --validate
          python3 scripts/build_collections.py --validate
          python3 scripts/validate_profile.py --smoke
      - name: Commit changed outputs only
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- rules/ai rules/services rules/security rules/custom rules/collections rules/manifest.json
          if git diff --cached --quiet; then
            echo 'No upstream or rule changes; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync categorized routing rules'
          git push origin "HEAD:${TARGET_BRANCH}"
