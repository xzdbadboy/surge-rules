[Rule]
# 分类目录版：2026-11-03 10:27:15 +08:00
# 所有远程规则使用 rules/ 下的分类路径；旧平铺链接已停用。
# 通用模板：替换 your-tailnet.ts.net，补充自己的服务器 IP，确认各策略组已存在。
# 本文件只替换现有配置的 [Rule] 段，不包含节点和策略组定义。
# Muse 应用目录匹配需要 Surge Mac 6.0.0+。

# # Tailnet 内部地址及本 tailnet 的域名
# IP-CIDR,100.64.0.0/10,Tailnet,no-resolve
# IP-CIDR6,fd7a:115c:a1e0::/48,Tailnet,no-resolve
# DOMAIN-SUFFIX,your-tailnet.ts.net,Tailnet

# 独立 Tailscale App 的控制面和 DERP 控制连接
DOMAIN-SUFFIX,tailscale.com,DIRECT
DOMAIN-SUFFIX,tailscale.io,DIRECT

# 独立 Tailscale App 的 tailnet 地址
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR6,fd7a:115c:a1e0::/48,DIRECT,no-resolve
DOMAIN-SUFFIX,your-tailnet.ts.net,DIRECT
DOMAIN-SUFFIX,ts.net,DIRECT
# //> 以上保持最上面 20261007

# 异常地址防护：必须位于 LAN 直连之前。
IP-CIDR,0.0.0.0/32,REJECT,no-resolve
AND,((PROCESS-NAME,Telegram),(OR,((IP-CIDR,0.0.0.0/8,no-resolve),(IP-CIDR,224.0.0.0/4,no-resolve)))),REJECT

# 自有服务器固定 IP 直连。
# 在此添加自己的固定服务器直连规则，例如：
# IP-CIDR,YOUR_SERVER_IPV4/32,DIRECT,no-resolve

# 已知内网地址优先直连；不为这一条规则主动解析公网域名。
RULE-SET,LAN,DIRECT,no-resolve

# 禁用 UDP 443（常见 QUIC）；支持 TCP 的客户端通常会回落。
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
# 额外禁止 googlevideo.com 的其他 UDP 端口；UDP 443 已被上一条覆盖。
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT-NO-DROP

# 广告、隐私与恶意域名拦截：当前启用。
# 上游 Domainset 已转换为标准 Surge RULE-SET，两条都使用 RULE-SET 引用。
RULE-SET,https://raw.githubusercontent.com/xzdbadboy/surge-rules/main/rules/security/RejectDomain.list,REJECT
RULE-SET,https://raw.githubusercontent.com/xzdbadboy/surge-rules/main/rules/security/Reject.list,REJECT,extended-matching

# Muse：先遵守 Tailnet、内网、异常地址和拦截规则，再统一走美国策略。
RULE-SET,https://raw.githubusercontent.com/xzdbadboy/surge-rules/main/rules/ai/Muse.list,"🇺🇲 美国节点"

# 苹果消息推送：保持香港策略，优先于苹果通用规则。
RULE-SET,https://raw.githubusercontent.com/xzdbadboy/surge-rules/main/rules/services/AppleAPNs.list,"🇭🇰 香港节点"

# 自定义站点与直连例外。
DOMAIN-SUFFIX,www.zhswx.com,"🇭🇰 香港节点",extended-matching // 小说网站
DOMAIN-SUFFIX,92yanqing.com,"🇭🇰 香港节点"
DOMAIN-SUFFIX,linux.do,"🇭🇰 香港节点"
DOMAIN-SUFFIX,100xlabs.space,DIRECT
DOMAIN-SUFFIX,mofas.one,DIRECT
DOMAIN-SUFFIX,ikunz.eu.org,"🇭🇰 香港节点" // 黑暗森林订阅
DOMAIN-SUFFIX,pool.ntp.org,DIRECT // 时间同步不纳入 AI 代理策略

