name: Validate routing rules

on:
  pull_request:
    paths:
      - config/**
      - scripts/**
      - tests/**
      - rules/**
      - examples/**
      - '*.list'
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - config/**
      - scripts/**
      - tests/**
      - rules/**
      - examples/**
      - '*.list'
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify categorized list layout
        run: >-
          python3 -c "from pathlib import Path; flat = [*Path('.').glob('*.list'), *Path('rules/custom').glob('*.list')]; assert not flat, 'Retired flat lists: ' + ', '.join(map(str, flat))"
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate configuration, rules and profile without network access
        run: |
          python3 scripts/stamp_custom.py --validate
          python3 scripts/sync_rules.py --validate
          python3 scripts/build_collections.py --validate
          python3 scripts/validate_profile.py --smoke
