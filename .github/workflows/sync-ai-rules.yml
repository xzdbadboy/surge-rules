name: Sync AI service rules

on:
  schedule:
    # UTC 00:17 / 06:17 / 12:17 / 18:17; Asia/Shanghai 08:17 / 14:17 / 20:17 / 02:17.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/rule_sources.json
      - scripts/sync_rules.py
      - tests/**
      - .github/workflows/sync-ai-rules.yml

permissions:
  contents: read

concurrency:
  group: sync-ai-rules-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test parser, service boundaries and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Fetch, filter and generate all service lists
        run: python3 scripts/sync_rules.py
      - name: Validate generated lists and manifest offline
        run: python3 scripts/sync_rules.py --validate
      - name: Commit changed outputs only
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- rules/ai rules/manifest.json
          if git diff --cached --quiet; then
            echo 'No upstream or rule changes; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync AI service rules'
          git push origin "HEAD:${DEFAULT_BRANCH}"
